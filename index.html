<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TYS Cafe - Sơ Đồ & Quản Lý Thanh Toán</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Plus Jakarta Sans','sans-serif']},colors:{tys:{500:'#c69214',600:'#a8780c',900:'#211604'},espresso:{900:'#14110f',950:'#0c0a09'}}}}}
</script>
<style>
:root{--bg:#0c0a09}
body{background:var(--bg);color:#f5f5f4;user-select:none;-webkit-tap-highlight-color:transparent}
.floorplan{background:radial-gradient(circle at center,#261f1b 0%,#0c0a09 100%);box-shadow:inset 0 0 60px rgba(0,0,0,.8)}
.pulse-unpaid{animation:pr 2s infinite}
@keyframes pr{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
.pulse-warn{animation:pw 1.6s infinite}
@keyframes pw{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.75)}50%{box-shadow:0 0 0 9px rgba(245,158,11,0)}}
.tbtn{transition:transform .15s}.tbtn:active{transform:scale(.94)}
@media(hover:hover){.tbtn:hover{transform:scale(1.08);z-index:20}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#1c1714}::-webkit-scrollbar-thumb{background:#443831;border-radius:4px}
</style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased bg-espresso-950">

<header class="bg-espresso-900/95 backdrop-blur border-b border-tys-500/20 sticky top-0 z-40 px-3 py-2.5">
 <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-2.5">
  <div class="flex items-center justify-between gap-3">
   <div class="flex items-center gap-3">
    <div class="w-11 h-11 rounded-xl border border-tys-500/40 bg-espresso-900 flex items-center justify-center text-tys-500 font-extrabold text-sm tracking-tighter">TYS</div>
    <div>
     <h1 class="font-extrabold text-lg leading-none text-amber-100">TYS CAFE <span class="text-[10px] align-middle font-bold px-1.5 py-0.5 rounded bg-tys-500/20 text-tys-500 border border-tys-500/30 uppercase">Thu ngân</span></h1>
     <p class="text-[11px] text-stone-400 mt-1" id="clock">--:--</p>
    </div>
   </div>
   <div class="md:hidden flex gap-1.5">
    <button onclick="openReport()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-tys-500/15 text-tys-500 border border-tys-500/40"><i class="fa-solid fa-chart-simple"></i></button>
    <button onclick="toggleView()" id="btnViewM" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-stone-900 text-stone-300 border border-stone-800"><i class="fa-solid fa-list-check"></i></button>
   </div>
  </div>

  <div class="grid grid-cols-4 gap-1.5 text-center text-[11px]">
   <div class="bg-red-950/40 p-1.5 rounded-lg border border-red-500/40"><div class="text-red-400 font-semibold">Chưa thu</div><div class="text-sm font-black text-red-300" id="sUnpaid">0</div></div>
   <div class="bg-orange-950/30 p-1.5 rounded-lg border border-orange-500/30"><div class="text-orange-400">Tiền đang nợ</div><div class="text-sm font-bold text-orange-300" id="sPending">0k</div></div>
   <div class="bg-emerald-950/40 p-1.5 rounded-lg border border-emerald-500/30"><div class="text-emerald-400">Trả trước</div><div class="text-sm font-bold text-emerald-300" id="sPaid">0</div></div>
   <div class="bg-tys-900/50 p-1.5 rounded-lg border border-tys-500/30"><div class="text-tys-500">Đã thu hôm nay</div><div class="text-sm font-bold text-amber-300" id="sRevenue">0k</div></div>
  </div>

  <div class="hidden md:flex items-center gap-1.5">
   <button onclick="toggleView()" id="btnViewD" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-stone-900 text-stone-300 border border-stone-800 flex items-center gap-1.5"><i class="fa-solid fa-list-check"></i> Danh sách</button>
   <button onclick="openReport()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-tys-500/15 text-tys-500 border border-tys-500/40 hover:bg-tys-500 hover:text-stone-950 flex items-center gap-1.5"><i class="fa-solid fa-chart-simple"></i> Báo cáo</button>
  </div>
 </div>
</header>

<div class="bg-espresso-900/80 border-b border-stone-800 px-3 py-2">
 <div class="max-w-7xl mx-auto flex items-center gap-1.5 overflow-x-auto text-xs">
  <span class="text-stone-500 font-medium shrink-0"><i class="fa-solid fa-filter"></i></span>
  <button onclick="setFilter('all')" class="fbtn shrink-0 px-2.5 py-1 rounded-md border border-stone-700 bg-stone-800 text-stone-200" data-f="all">Tất cả</button>
  <button onclick="setFilter('unpaid')" class="fbtn shrink-0 px-2.5 py-1 rounded-md border border-stone-700 bg-stone-800 text-red-400" data-f="unpaid">Cần thu</button>
  <button onclick="setFilter('paid')" class="fbtn shrink-0 px-2.5 py-1 rounded-md border border-stone-700 bg-stone-800 text-emerald-400" data-f="paid">Trả trước</button>
  <button onclick="setFilter('empty')" class="fbtn shrink-0 px-2.5 py-1 rounded-md border border-stone-700 bg-stone-800 text-stone-400" data-f="empty">Trống</button>
  <button onclick="setFilter('dirty')" class="fbtn shrink-0 px-2.5 py-1 rounded-md border border-stone-700 bg-stone-800 text-purple-400" data-f="dirty">Cần dọn</button>
  <div class="ml-auto hidden lg:flex items-center gap-3 text-stone-400 shrink-0">
   <span><i class="fa-solid fa-circle text-stone-600"></i> Trống</span>
   <span><i class="fa-solid fa-circle text-emerald-500"></i> Trả trước</span>
   <span><i class="fa-solid fa-circle text-red-500"></i> Chưa trả</span>
   <span><i class="fa-solid fa-circle text-purple-500"></i> Cần dọn</span>
   <span><i class="fa-solid fa-circle text-amber-400"></i> Quá giờ</span>
  </div>
 </div>
</div>

<main class="flex-1 p-2 md:p-5">
 <div class="max-w-7xl mx-auto">
  <div id="mapView">
   <div class="floorplan relative w-full rounded-2xl border border-tys-500/20 p-3 overflow-auto">
    <div class="relative w-[1000px] h-[700px] mx-auto origin-top-left" id="canvas" style="transform:scale(1)">
     <div class="absolute inset-0 bg-[radial-gradient(#3a302a_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>
     <div class="absolute top-[20px] left-[230px] w-[135px] h-[180px] rounded-2xl border-2 border-stone-600 bg-stone-900/40"></div>
     <div class="absolute top-[20px] left-[365px] w-[435px] h-[200px] border-2 border-stone-600 bg-stone-900/30 flex items-center justify-center text-stone-600 text-xs font-bold tracking-widest">QUẦY PHA CHẾ</div>
     <div class="absolute top-[220px] left-[530px] w-[270px] h-[76px] rounded-2xl border-2 border-stone-600 bg-stone-900/40"></div>
     <div class="absolute top-[302px] left-[570px] w-[230px] h-[8px] border-2 border-stone-600 bg-stone-800/60"></div>
     <div class="absolute top-[220px] left-[365px] w-[28px] h-[35px] border-2 border-t-0 border-stone-600 rounded-b-full"></div>
     <div class="absolute top-[220px] left-[457px] w-[28px] h-[35px] border-2 border-t-0 border-stone-600 rounded-b-full"></div>
     <div class="absolute top-[220px] left-[393px] w-[64px] h-[470px] border-x-2 border-stone-600"></div>
     <div class="absolute top-[660px] left-[180px] w-[200px] h-5 border-2 border-stone-600 bg-stone-800/80"></div>
     <div class="absolute top-[660px] left-[565px] w-[75px] h-5 border-2 border-stone-600 bg-stone-800/80"></div>
     <div class="absolute top-[660px] left-[705px] w-[90px] h-5 border-2 border-stone-600 bg-stone-800/80"></div>
     <div class="absolute top-[30px] left-[240px] text-[10px] text-stone-500 font-bold">PHÒNG MÁY LẠNH</div>
    </div>
   </div>
   <p class="text-center text-[11px] text-stone-500 mt-2">Chạm bàn để gọi món · Giữ 0.5s để thu tiền nhanh</p>
  </div>

  <div id="listView" class="hidden">
   <div class="bg-espresso-900 rounded-2xl border border-stone-800 p-3">
    <input type="text" id="search" oninput="renderList()" placeholder="Tìm bàn, món, ghi chú..." class="w-full mb-3 px-3 py-2 rounded-lg bg-stone-800 border border-stone-700 text-xs text-stone-200 focus:outline-none focus:border-tys-500">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5" id="listGrid"></div>
   </div>
  </div>
 </div>
</main>

<!-- MODAL BÀN -->
<div id="tableModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center sm:p-3">
 <div class="bg-espresso-900 border border-tys-500/30 w-full max-w-lg sm:rounded-2xl rounded-t-2xl shadow-2xl flex flex-col max-h-[92vh]">
  <div class="bg-stone-900 px-4 py-3 border-b border-stone-800 flex items-center justify-between">
   <div class="flex items-center gap-3">
    <div id="mBadge" class="w-10 h-10 rounded-xl bg-tys-500 font-extrabold text-stone-950 flex items-center justify-center">B0</div>
    <div><h3 class="font-bold text-amber-100" id="mTitle">Bàn</h3><p class="text-[11px] text-stone-400" id="mSub">—</p></div>
   </div>
   <button onclick="closeModal()" class="w-9 h-9 rounded-lg bg-stone-800 text-stone-300"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <div class="p-4 overflow-y-auto space-y-3 flex-1">
   <div class="grid grid-cols-2 gap-2 text-xs">
    <button onclick="setStatus('empty')" id="stEmpty" class="p-2.5 rounded-xl border border-stone-800 bg-stone-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-stone-500"></span><b class="text-stone-300">Trống</b></button>
    <button onclick="setStatus('unpaid')" id="stUnpaid" class="p-2.5 rounded-xl border border-stone-800 bg-stone-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-red-500"></span><b class="text-red-400">Chưa trả</b></button>
    <button onclick="setStatus('paid')" id="stPaid" class="p-2.5 rounded-xl border border-stone-800 bg-stone-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span><b class="text-emerald-400">Trả trước</b></button>
    <button onclick="setStatus('dirty')" id="stDirty" class="p-2.5 rounded-xl border border-stone-800 bg-stone-900 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span><b class="text-purple-400">Cần dọn</b></button>
   </div>

   <div class="bg-stone-900/70 p-3 rounded-xl border border-stone-800 space-y-2.5">
    <div class="flex items-center justify-between">
     <span class="text-[11px] font-bold text-stone-300 uppercase"><i class="fa-solid fa-mug-hot text-tys-500"></i> Gọi món</span>
     <span class="text-sm text-tys-500 font-extrabold" id="mTotal">0đ</span>
    </div>
    <div class="flex flex-wrap gap-1.5 text-[11px]" id="menuPills"></div>
    <div class="flex gap-1.5 text-xs">
     <input id="cName" placeholder="Món khác..." class="flex-1 min-w-0 bg-stone-900 border border-stone-800 rounded-lg px-2 py-1.5 text-stone-200 focus:outline-none focus:border-tys-500">
     <input id="cPrice" type="number" inputmode="numeric" placeholder="Giá(k)" class="w-20 bg-stone-900 border border-stone-800 rounded-lg px-2 py-1.5 text-stone-200 focus:outline-none focus:border-tys-500">
     <button onclick="addCustom()" class="px-3 rounded-lg bg-tys-500 text-stone-950 font-bold">+</button>
    </div>
    <div id="mItems" class="min-h-[52px] max-h-[150px] overflow-y-auto space-y-1.5 text-xs bg-espresso-950 p-2 rounded-lg border border-stone-800"></div>
   </div>

   <div class="grid grid-cols-2 gap-2 text-xs">
    <select id="mPay" class="bg-stone-900 border border-stone-800 rounded-lg p-2 text-stone-200 focus:outline-none focus:border-tys-500">
     <option>Tiền mặt</option><option>Chuyển khoản QR</option><option>MoMo / Ví điện tử</option>
    </select>
    <input id="mNote" placeholder="Ghi chú (3 khách...)" class="bg-stone-900 border border-stone-800 rounded-lg p-2 text-stone-200 focus:outline-none focus:border-tys-500">
   </div>

   <div id="quickBar" class="space-y-2"></div>
  </div>

  <div class="bg-stone-900 px-4 py-3 border-t border-stone-800 flex items-center justify-between">
   <button onclick="clearTable()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-red-400 hover:bg-red-500/10"><i class="fa-solid fa-trash"></i> Xoá bàn</button>
   <div class="flex gap-2">
    <button onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-stone-800 text-stone-300">Hủy</button>
    <button onclick="saveModal()" class="px-5 py-2 rounded-xl text-xs font-bold bg-tys-500 text-stone-950">Lưu</button>
   </div>
  </div>
 </div>
</div>

<!-- MODAL BÁO CÁO -->
<div id="reportModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center sm:p-3">
 <div class="bg-espresso-900 border border-tys-500/30 w-full max-w-xl sm:rounded-2xl rounded-t-2xl flex flex-col max-h-[92vh]">
  <div class="bg-stone-900 px-4 py-3 border-b border-stone-800 flex items-center justify-between">
   <h3 class="font-bold text-amber-100"><i class="fa-solid fa-chart-simple text-tys-500"></i> Báo cáo ca hôm nay</h3>
   <button onclick="closeReport()" class="w-9 h-9 rounded-lg bg-stone-800 text-stone-300"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div id="reportBody" class="p-4 overflow-y-auto space-y-3 flex-1 text-xs"></div>
  <div class="bg-stone-900 px-4 py-3 border-t border-stone-800 flex items-center justify-between">
   <button onclick="closeShift()" class="px-3 py-2 rounded-xl text-xs font-bold bg-red-500/15 text-red-400 border border-red-500/30"><i class="fa-solid fa-flag-checkered"></i> Kết ca (dọn hết bàn)</button>
   <button onclick="closeReport()" class="px-4 py-2 rounded-xl text-xs font-bold bg-tys-500 text-stone-950">Đóng</button>
  </div>
 </div>
</div>

<div id="toast" class="hidden"></div>

<script>
const T=30;
const POS={1:[55,60],2:[135,35],3:[135,90],4:[55,260],5:[55,315],6:[135,285],7:[85,460],8:[100,535],9:[165,370],10:[225,370],11:[530,590],12:[225,590],13:[305,590],14:[145,590],15:[245,85],16:[305,85],17:[560,234],18:[715,234],19:[610,322],20:[670,322],21:[730,322],22:[590,590],23:[725,590],24:[775,590],25:[825,590],26:[875,590],27:[925,590],28:[925,510],29:[875,510],30:[825,510]};
const MENU=[['TYS Cold Brew',45],['Cà phê sữa đá',30],['Cà phê đen',25],['Bạc xỉu',35],['Trà đào sả',40],['Matcha Latte',45],['Sinh tố bơ',45],['Bánh ngọt TYS',40],['Nước suối',10]];
const ZONE=id=>[15,16].includes(id)?'Phòng máy lạnh':[17,18,19,20,21].includes(id)?'Khu quầy bar':id<=14?'Sân trước':'Sân sau';
const LIMIT_SIT=120, LIMIT_CLEAN=10;

let tables={},bills=[],active=null,filter='all',mStatus='empty',mItems=[],toastT=null,pressT=null;

const money=k=>(k*1000).toLocaleString('vi-VN')+'đ';
const short=k=>k>=1000?(k/1000).toFixed(1).replace('.0','')+'tr':k+'k';
const dayKey=ts=>new Date(ts).toLocaleDateString('sv');
const sum=it=>it.reduce((s,i)=>s+i.price*(i.qty||1),0);
const blank=i=>({id:i,status:'empty',items:[],total:0,startTime:null,paymentMethod:'Tiền mặt',note:'',billCode:null});
const mins=t=>t.startTime?Math.floor((Date.now()-t.startTime)/60000):0;
const late=t=>t.status==='dirty'?mins(t)>=LIMIT_CLEAN:(t.status!=='empty'&&mins(t)>=LIMIT_SIT);

/* ---------- Dữ liệu ---------- */
function load(){
 try{tables=JSON.parse(localStorage.getItem('tys_tables')||'{}')}catch(e){tables={}}
 try{bills=JSON.parse(localStorage.getItem('tys_bills')||'[]')}catch(e){bills=[]}
 for(let i=1;i<=T;i++){
  const t=Object.assign(blank(i),tables[i]||{});
  t.items=(t.items||[]).map(x=>({name:x.name,price:x.price,qty:x.qty||1}));
  t.total=sum(t.items);t.note=t.note||'';tables[i]=t;
 }
}
const save=()=>{localStorage.setItem('tys_tables',JSON.stringify(tables));stats()};
const saveBills=()=>localStorage.setItem('tys_bills',JSON.stringify(bills));
function bill(t){const b={code:'HD'+String(Date.now()).slice(-6),table:t.id,items:t.items.map(i=>({n:i.name,q:i.qty,p:i.price})),total:t.total,method:t.paymentMethod||'Tiền mặt',time:Date.now(),mins:mins(t)};bills.push(b);saveBills();return b}

/* ---------- Toast + hoàn tác ---------- */
function toast(msg,type='ok',undo){
 const el=document.getElementById('toast');
 el.className='fixed bottom-4 left-1/2 -translate-x-1/2 z-[60] px-4 py-3 rounded-xl shadow-2xl text-sm font-bold flex items-center gap-3 border '+(type==='warn'?'bg-amber-500 text-stone-950 border-amber-300':type==='err'?'bg-red-600 text-white border-red-300':'bg-emerald-600 text-white border-emerald-300');
 el.innerHTML='<span>'+msg+'</span>';
 if(undo){const b=document.createElement('button');b.className='px-2.5 py-1 rounded-lg bg-black/30 text-[11px] uppercase tracking-wider';b.innerHTML='<i class="fa-solid fa-rotate-left"></i> Hoàn tác';b.onclick=()=>{undo();el.classList.add('hidden')};el.appendChild(b)}
 el.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('hidden'),undo?7000:2600);
}

/* ---------- Sơ đồ ---------- */
function renderMap(){
 const c=document.getElementById('canvas');
 [...c.querySelectorAll('[data-t]')].forEach(e=>e.remove());
 for(let i=1;i<=T;i++){
  const t=tables[i],p=POS[i];if(!p)continue;
  let cls='bg-stone-900/90 border-stone-700 text-stone-300',badge='';
  if(t.status==='unpaid'){cls='bg-red-950/90 border-red-500 text-red-200 pulse-unpaid';badge='CHƯA TRẢ'}
  else if(t.status==='paid'){cls='bg-emerald-950/90 border-emerald-500 text-emerald-200';badge='ĐÃ TRẢ'}
  else if(t.status==='dirty'){cls='bg-purple-950/90 border-purple-500 text-purple-200';badge='DỌN'}
  const ov=late(t);if(ov)cls+=' ring-2 ring-amber-400 pulse-warn';
  const show=filter==='all'||t.status===filter;
  const m=mins(t);
  const d=document.createElement('div');
  d.dataset.t=i;d.className='absolute';d.style.cssText=`left:${p[0]}px;top:${p[1]}px`;
  d.innerHTML=`<button class="tbtn relative w-12 h-12 rounded-xl border-2 ${cls} ${show?'':'opacity-25 pointer-events-none'} flex flex-col items-center justify-center shadow-lg">
   ${badge?`<span class="absolute -top-2 -right-2 px-1 rounded-full text-[8px] font-black ${t.status==='unpaid'?'bg-red-600':t.status==='paid'?'bg-emerald-600':'bg-purple-600'} text-white">${badge}</span>`:''}
   <span class="text-xs font-extrabold leading-none">B${i}</span>
   ${t.total?`<span class="text-[9px] font-bold text-tys-500 leading-none mt-0.5">${t.total}k</span>`:''}
   ${t.status!=='empty'?`<span class="text-[9px] leading-none mt-0.5 ${ov?'text-amber-300 font-bold':'opacity-70'}"><i class="fa-regular fa-clock"></i> ${m>=60?Math.floor(m/60)+'h'+(m%60):m+'p'}</span>`:''}
  </button>`;
  const btn=d.firstElementChild;
  btn.onclick=()=>{if(!pressT)openModal(i)};
  btn.onpointerdown=()=>{pressT=setTimeout(()=>{pressT=null;quickCollect(i)},500)};
  ['pointerup','pointerleave','pointercancel'].forEach(e=>btn.addEventListener(e,()=>{clearTimeout(pressT);setTimeout(()=>pressT=null,50)}));
  c.appendChild(d);
 }
 fitCanvas();
}
function fitCanvas(){const c=document.getElementById('canvas'),w=c.parentElement.clientWidth-24;const s=Math.min(1,w/1000);c.style.transform=`scale(${s})`;c.parentElement.style.height=(700*s+28)+'px'}
addEventListener('resize',fitCanvas);

/* ---------- Danh sách ---------- */
function renderList(){
 const g=document.getElementById('listGrid'),q=(document.getElementById('search').value||'').toLowerCase().trim();
 g.innerHTML='';
 for(let i=1;i<=T;i++){
  const t=tables[i];
  if(filter!=='all'&&t.status!==filter)continue;
  if(q&&!(('bàn '+i).includes(q)||String(i)===q||t.note.toLowerCase().includes(q)||t.items.some(x=>x.name.toLowerCase().includes(q))))continue;
  const S={empty:['Trống','bg-stone-800 text-stone-400'],unpaid:['Chưa thanh toán','bg-red-500/20 text-red-400'],paid:['Đã trả trước','bg-emerald-500/20 text-emerald-400'],dirty:['Cần dọn','bg-purple-500/20 text-purple-400']}[t.status];
  const d=document.createElement('div');
  d.className='bg-stone-900 p-3 rounded-xl border '+(late(t)?'border-amber-500/60':'border-stone-800')+' cursor-pointer';
  d.onclick=()=>openModal(i);
  d.innerHTML=`<div class="flex items-center justify-between mb-1.5"><b class="text-amber-100 text-sm">Bàn ${i} <span class="text-[10px] font-normal text-stone-500">${ZONE(i)}</span></b><span class="px-2 py-0.5 rounded text-[10px] font-bold ${S[1]}">${S[0]}</span></div>
  <div class="text-[11px] text-stone-400 space-y-0.5">
   <div><i class="fa-solid fa-coins text-tys-500"></i> <b class="text-amber-200">${money(t.total)}</b>${t.items.length?' · '+t.items.length+' món':''}</div>
   ${t.status!=='empty'?`<div class="${late(t)?'text-amber-400 font-bold':''}"><i class="fa-regular fa-clock"></i> ${mins(t)} phút${late(t)?' — cần chú ý!':''}</div>`:''}
   ${t.note?`<div class="italic text-stone-500"><i class="fa-regular fa-note-sticky"></i> ${t.note}</div>`:''}
  </div>`;
  g.appendChild(d);
 }
 if(!g.children.length)g.innerHTML='<div class="col-span-full text-center text-stone-500 py-6 text-xs">Không có bàn nào khớp bộ lọc.</div>';
}
const renderAll=()=>{renderMap();renderList();stats()};

/* ---------- Thống kê ---------- */
function stats(){
 let u=0,p=0,e=0,d=0,pend=0;
 Object.values(tables).forEach(t=>{t.status==='unpaid'?(u++,pend+=t.total):t.status==='paid'?p++:t.status==='dirty'?d++:e++});
 const today=dayKey(Date.now());
 const rev=bills.filter(b=>dayKey(b.time)===today).reduce((s,b)=>s+b.total,0);
 sUnpaid.innerText=u;sPaid.innerText=p;sPending.innerText=short(pend);sRevenue.innerText=short(rev);
 const C={all:T,unpaid:u,paid:p,empty:e,dirty:d};
 document.querySelectorAll('.fbtn').forEach(b=>{let s=b.querySelector('.cnt');if(!s){s=document.createElement('span');s.className='cnt ml-1 font-bold opacity-70';b.appendChild(s)}s.innerText='('+C[b.dataset.f]+')'});
}
function setFilter(f){filter=f;document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('ring-2',b.dataset.f===f));document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('ring-tys-500',b.dataset.f===f));renderAll()}
function toggleView(){const m=document.getElementById('mapView'),l=document.getElementById('listView');const toList=!m.classList.contains('hidden');m.classList.toggle('hidden',toList);l.classList.toggle('hidden',!toList);[btnViewD,btnViewM].forEach(b=>b.innerHTML=toList?'<i class="fa-solid fa-map"></i>'+(b===btnViewD?' Sơ đồ':''):'<i class="fa-solid fa-list-check"></i>'+(b===btnViewD?' Danh sách':''));if(toList)renderList();else fitCanvas()}

/* ---------- Modal bàn ---------- */
function openModal(i){
 active=i;const t=tables[i];mStatus=t.status;mItems=t.items.map(x=>({...x}));
 mBadge.innerText='B'+i;mTitle.innerText='Bàn '+i+' · '+ZONE(i);
 mSub.innerText=t.status==='empty'?'Bàn trống':(mins(t)+' phút'+(t.billCode?' · đã thanh toán':'')+(late(t)?' · QUÁ GIỜ':''));
 mPay.value=t.paymentMethod;mNote.value=t.note;
 menuPills.innerHTML=MENU.map(m=>`<button onclick="addItem('${m[0]}',${m[1]})" class="px-2 py-1 rounded-lg bg-stone-800 hover:bg-tys-500 hover:text-stone-950 text-stone-300">+ ${m[0]} <b>${m[1]}k</b></button>`).join('');
 drawStatus();drawItems();tableModal.classList.remove('hidden');
}
const closeModal=()=>{tableModal.classList.add('hidden');active=null};
function setStatus(s){mStatus=s;drawStatus();drawQuick()}
function drawStatus(){({empty:stEmpty,unpaid:stUnpaid,paid:stPaid,dirty:stDirty})&&['empty','unpaid','paid','dirty'].forEach(k=>{const b=document.getElementById('st'+k[0].toUpperCase()+k.slice(1));b.classList.toggle('ring-2',k===mStatus);b.classList.toggle('ring-tys-500',k===mStatus)})}
function addItem(n,p){const f=mItems.find(x=>x.name===n);f?f.qty++:mItems.push({name:n,price:p,qty:1});if(mStatus==='empty'){mStatus='unpaid';drawStatus()}drawItems()}
function addCustom(){const n=cName.value.trim(),p=parseInt(cPrice.value,10);if(!n||!p)return toast('Nhập tên món và giá (nghìn đồng)','warn');addItem(n,p);cName.value='';cPrice.value=''}
function qty(i,d){mItems[i].qty+=d;if(mItems[i].qty<=0)mItems.splice(i,1);drawItems()}
function drawItems(){
 mItems_el=document.getElementById('mItems');
 mItems_el.innerHTML=mItems.length?'':'<div class="text-center text-stone-600 text-[11px] py-4">Chưa có món — bấm nút phía trên để gọi món</div>';
 mItems.forEach((it,i)=>{
  const r=document.createElement('div');
  r.className='flex items-center justify-between bg-stone-900 px-2 py-1.5 rounded border border-stone-800';
  r.innerHTML=`<span class="text-stone-200 truncate">${it.name}</span>
  <span class="flex items-center gap-1.5 shrink-0">
   <button onclick="qty(${i},-1)" class="w-6 h-6 rounded bg-stone-800 text-stone-300">−</button>
   <b class="w-4 text-center text-stone-100">${it.qty}</b>
   <button onclick="qty(${i},1)" class="w-6 h-6 rounded bg-stone-800 hover:bg-tys-500 hover:text-stone-950 text-stone-300">+</button>
   <b class="w-12 text-right text-tys-500">${it.price*it.qty}k</b>
   <button onclick="qty(${i},-99)" class="text-stone-600 hover:text-red-400 px-1"><i class="fa-solid fa-xmark"></i></button>
  </span>`;
  mItems_el.appendChild(r);
 });
 mTotal.innerText=money(sum(mItems));drawQuick();
}
function drawQuick(){
 if(!active)return;
 const free=Object.values(tables).filter(x=>x.status==='empty'&&x.id!==active).map(x=>`<option value="${x.id}">Bàn ${x.id} (${ZONE(x.id)})</option>`).join('');
 let main='';
 if(mStatus==='unpaid')main=`<button onclick="collect()" class="w-full p-3 rounded-xl bg-emerald-600 text-white font-bold text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-hand-holding-dollar"></i> Thu ${money(sum(mItems))} & khách về</button>`;
 else if(mStatus==='paid')main=`<button onclick="leave()" class="w-full p-3 rounded-xl bg-purple-600 text-white font-bold text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-person-walking-arrow-right"></i> Khách về → cần dọn</button>`;
 else if(mStatus==='dirty')main=`<button onclick="cleaned()" class="w-full p-3 rounded-xl bg-stone-700 text-white font-bold text-sm flex items-center justify-center gap-2"><i class="fa-solid fa-broom"></i> Đã dọn xong → bàn trống</button>`;
 quickBar.innerHTML=main+`<div class="flex gap-2 text-xs"><select id="moveTo" class="flex-1 bg-stone-900 border border-stone-800 rounded-lg p-2 text-stone-300">${free||'<option value="">Hết bàn trống</option>'}</select><button onclick="moveTable()" class="px-3 py-2 rounded-lg bg-stone-800 text-stone-200 font-semibold whitespace-nowrap"><i class="fa-solid fa-right-left"></i> Chuyển bàn</button></div>`;
}
function commit(){const t=tables[active];t.items=mItems.map(x=>({...x}));t.total=sum(t.items);t.paymentMethod=mPay.value;t.note=mNote.value;return t}
function saveModal(){
 if(!active)return;const t=commit(),prev=t.status;t.status=mStatus;
 if(prev==='empty'&&mStatus!=='empty')t.startTime=Date.now();
 if(mStatus==='dirty'&&prev!=='dirty')t.startTime=Date.now();
 if(mStatus==='empty'){t.startTime=null;t.billCode=null;t.items=[];t.total=0}
 if(mStatus==='paid'&&t.total>0){
  const b=bills.find(x=>x.code===t.billCode);
  if(b){b.total=t.total;b.items=t.items.map(i=>({n:i.name,q:i.qty,p:i.price}));b.method=t.paymentMethod;saveBills()}
  else{t.billCode=bill(t).code;toast('Đã ghi nhận '+money(t.total)+' (trả trước) · Bàn '+t.id)}
 }
 save();renderAll();closeModal();
}
function collect(){
 const t=commit();
 if(!t.total)return toast('Bàn chưa có món để thu tiền','warn');
 const snap=JSON.parse(JSON.stringify(t)),b=t.billCode?null:bill(t);
 Object.assign(t,{status:'dirty',items:[],total:0,startTime:Date.now(),billCode:null});
 save();renderAll();closeModal();
 toast('Đã thu '+money(snap.total)+' · Bàn '+t.id,'ok',()=>{tables[snap.id]=snap;if(b){bills=bills.filter(x=>x.code!==b.code);saveBills()}save();renderAll()});
}
function quickCollect(i){
 const t=tables[i];
 if(t.status!=='unpaid'||!t.total)return openModal(i);
 const snap=JSON.parse(JSON.stringify(t)),b=t.billCode?null:bill(t);
 Object.assign(t,{status:'dirty',items:[],total:0,startTime:Date.now(),billCode:null});
 save();renderAll();
 toast('Thu nhanh '+money(snap.total)+' · Bàn '+i,'ok',()=>{tables[i]=snap;if(b){bills=bills.filter(x=>x.code!==b.code);saveBills()}save();renderAll()});
}
function leave(){const t=commit();Object.assign(t,{status:'dirty',items:[],total:0,startTime:Date.now(),billCode:null});save();renderAll();closeModal();toast('Bàn '+t.id+' cần dọn')}
function cleaned(){tables[active]=blank(active);save();renderAll();closeModal();toast('Bàn đã sẵn sàng đón khách')}
function moveTable(){
 const to=parseInt(document.getElementById('moveTo').value,10);
 if(!to)return toast('Không còn bàn trống','warn');
 const from=commit(),old=active;
 tables[to]=Object.assign(JSON.parse(JSON.stringify(from)),{id:to});
 tables[old]=Object.assign(blank(old),{status:'dirty',startTime:Date.now()});
 save();renderAll();closeModal();toast('Đã chuyển bàn '+old+' → bàn '+to);
}
function clearTable(){const snap=JSON.parse(JSON.stringify(tables[active])),id=active;tables[id]=blank(id);save();renderAll();closeModal();toast('Đã xoá dữ liệu bàn '+id,'err',()=>{tables[id]=snap;save();renderAll()})}

/* ---------- Báo cáo & kết ca ---------- */
function openReport(){
 const today=dayKey(Date.now()),list=bills.filter(b=>dayKey(b.time)===today);
 const tot=list.reduce((s,b)=>s+b.total,0),avg=list.length?Math.round(tot/list.length):0;
 const byM={},byI={},byH={};
 list.forEach(b=>{byM[b.method]=(byM[b.method]||0)+b.total;b.items.forEach(i=>byI[i.n]=(byI[i.n]||0)+i.q);const h=new Date(b.time).getHours();byH[h]=(byH[h]||0)+b.total});
 const mx=Math.max(1,...Object.values(byH));
 const hours=Object.keys(byH).sort((a,b)=>a-b).map(h=>`<div class="flex items-center gap-2"><span class="w-8 text-stone-400">${h}h</span><div class="flex-1 h-2.5 bg-stone-800 rounded"><div class="h-2.5 bg-tys-500 rounded" style="width:${Math.round(byH[h]/mx*100)}%"></div></div><span class="w-20 text-right text-amber-200 font-bold">${money(byH[h])}</span></div>`).join('')||'<div class="text-stone-500">Chưa có hoá đơn nào.</div>';
 const top=Object.entries(byI).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q],i)=>`<div class="flex justify-between py-1 border-b border-stone-800"><span class="text-stone-300">${i+1}. ${n}</span><b class="text-tys-500">${q} ly/phần</b></div>`).join('')||'<div class="text-stone-500">—</div>';
 const pay=Object.entries(byM).map(([m,v])=>`<div class="flex justify-between"><span class="text-stone-400">${m}</span><b class="text-amber-200">${money(v)}</b></div>`).join('')||'<div class="text-stone-500">—</div>';
 const debt=Object.values(tables).filter(t=>t.status==='unpaid'&&t.total).map(t=>'B'+t.id+': '+money(t.total)).join(' · ')||'Không còn bàn nợ';
 const csv='Ma HD,Ban,Gio,Phut ngoi,Hinh thuc,Tong VND,Chi tiet\n'+list.map(b=>`${b.code},${b.table},${new Date(b.time).toLocaleTimeString('vi-VN')},${b.mins},${b.method},${b.total*1000},"${b.items.map(i=>i.n+' x'+i.q).join('; ')}"`).join('\n');
 reportBody.innerHTML=`
 <div class="grid grid-cols-3 gap-2 text-center">
  <div class="bg-stone-900 p-2.5 rounded-xl border border-stone-800"><div class="text-stone-400">Hoá đơn</div><div class="text-lg font-black text-stone-100">${list.length}</div></div>
  <div class="bg-tys-900/50 p-2.5 rounded-xl border border-tys-500/30"><div class="text-tys-500">Đã thu</div><div class="text-lg font-black text-amber-300">${money(tot)}</div></div>
  <div class="bg-stone-900 p-2.5 rounded-xl border border-stone-800"><div class="text-stone-400">TB/hoá đơn</div><div class="text-lg font-black text-stone-100">${money(avg)}</div></div>
 </div>
 <div class="bg-stone-900 p-3 rounded-xl border border-stone-800 space-y-1"><div class="font-bold text-stone-300 mb-1">Theo hình thức</div>${pay}</div>
 <div class="bg-stone-900 p-3 rounded-xl border border-stone-800"><div class="font-bold text-stone-300 mb-1">Top món bán chạy</div>${top}</div>
 <div class="bg-stone-900 p-3 rounded-xl border border-stone-800 space-y-1.5"><div class="font-bold text-stone-300 mb-1">Doanh thu theo giờ</div>${hours}</div>
 <div class="bg-red-950/30 p-3 rounded-xl border border-red-500/30"><div class="font-bold text-red-300 mb-1">Bàn còn nợ tiền</div><div class="text-stone-300">${debt}</div></div>
 <div><div class="font-bold text-stone-300 mb-1">Xuất dữ liệu (CSV — copy dán vào Excel)</div>
 <textarea id="csvBox" readonly class="w-full h-24 bg-stone-900 border border-stone-800 rounded-lg p-2 text-[10px] text-stone-400 font-mono">${csv}</textarea>
 <button onclick="copyCsv()" class="mt-1 px-3 py-1.5 rounded-lg bg-stone-800 text-stone-200 font-semibold"><i class="fa-regular fa-copy"></i> Sao chép</button></div>`;
 reportModal.classList.remove('hidden');
}
const closeReport=()=>reportModal.classList.add('hidden');
function copyCsv(){const b=document.getElementById('csvBox');b.select();try{document.execCommand('copy');toast('Đã sao chép báo cáo')}catch(e){toast('Hãy chọn và copy thủ công','warn')}}
function closeShift(){
 if(!confirm('KẾT CA: đưa toàn bộ 30 bàn về trạng thái TRỐNG. Hoá đơn đã thu vẫn được lưu. Tiếp tục?'))return;
 for(let i=1;i<=T;i++)tables[i]=blank(i);
 save();renderAll();closeReport();toast('Đã kết ca ✓');
}

/* ---------- Khởi động ---------- */
addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeReport()}});
tableModal.onclick=e=>{if(e.target.id==='tableModal')closeModal()};
reportModal.onclick=e=>{if(e.target.id==='reportModal')closeReport()};
load();renderAll();
const tick=()=>{const n=new Date();clock.innerText=n.toLocaleTimeString('vi-VN')+' · '+n.toLocaleDateString('vi-VN')};
tick();setInterval(tick,1000);
setInterval(()=>{renderMap();if(!document.getElementById('listView').classList.contains('hidden'))renderList();
 const w=Object.values(tables).filter(late);if(w.length)toast(w.length+' bàn cần chú ý (quá giờ / chờ dọn lâu)','warn');},60000);
</script>
</body>
</html>
