<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>TYS FOOD - XE BÁNH MÌ</title>
<meta name="theme-color" content="#f7f5f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TYS FOOD">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TYS FOOD · XE BÁNH MÌ — cùng ngôn ngữ thiết kế với index.html
   Đồng nâu #C9944A · nền be ấm · thẻ bo tròn · tờ bill răng cưa · nhãn đèn báo · Warm Night Café (tối)
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #f7f5f0; --surface: #ffffff; --surface-2: #f4f1ea; --surface-3: #ebe6da;
  --text: #1c1a17; --muted: #6e685d; --line: #e8e1d2;
  --gold: #C9944A; --gold-d: #a9793a; --gold-l: #E1B66E; --gold-soft: #fbf3e4; --on-gold: #1a1510;
  --sage: #3f7a2e; --sage-soft: #e9f5df; --sage-line: #bfdaae;
  --brick: #d2492c; --brick-d: #a83420; --brick-soft: #fbeae5; --brick-line: #f0b8a8;
  --shadow: 0 1px 2px rgba(26,21,16,.05), 0 10px 22px -14px rgba(107,79,53,.38);
  --nav-h: 78px;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0C0B09; --surface: #17130e; --surface-2: #120f0b; --surface-3: #241c14;
  --text: #F2EDE4; --muted: #A79880; --line: rgba(230,196,140,.14);
  --gold: #C9944A; --gold-d: #E1B66E; --gold-l: #E1B66E; --gold-soft: #1E170D; --on-gold: #0C0B09;
  --sage: #8DBB6F; --sage-soft: #10160D; --sage-line: #4C7236;
  --brick: #E2724C; --brick-d: #F0C4AC; --brick-soft: #1C110B; --brick-line: #402A20;
  --shadow: 0 12px 26px -14px rgba(0,0,0,.65), 0 0 0 1px rgba(230,196,140,.05);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
html { background: var(--bg); }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 15px; line-height: 1.45; letter-spacing: -.01em;
  display: flex; flex-direction: column; overflow: hidden;
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; touch-action: manipulation;
  transition: background-color .4s ease, color .4s ease;
}
input { user-select: text; -webkit-user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--gold) 55%, transparent); outline-offset: 2px; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #c9bfae; border-radius: 4px; }
html[data-theme="dark"] ::-webkit-scrollbar-thumb { background: #3a2f21; }

/* ---------- Masthead ---------- */
.hd { flex-shrink: 0; position: relative; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
html[data-theme="dark"] .hd { box-shadow: 0 1px 0 rgba(230,196,140,.055), 0 16px 34px -22px rgba(0,0,0,.65); }
.mast { position: relative; display: flex; align-items: center; justify-content: center; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; min-height: 66px; }
.mast .back, .mast .whoBtn { position: absolute; top: 50%; transform: translateY(calc(-50% + env(safe-area-inset-top) / 2)); }
.mast .back { left: 12px; }
.mast .whoBtn { right: 12px; max-width: 32%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn {
  min-width: 38px; height: 38px; padding: 0 11px; border-radius: 12px; flex-shrink: 0;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--gold-d);
  font-size: 12px; font-weight: 700; transition: transform .12s, background .2s;
}
.ibtn:active { transform: scale(.92); }
.whoBtn { background: color-mix(in srgb, var(--gold) 12%, transparent); border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
.mast .back:active, .mast .whoBtn:active { transform: translateY(calc(-50% + env(safe-area-inset-top) / 2)) scale(.92); }
.brand { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 46px; height: 46px; border-radius: 14px; padding: 5px; flex-shrink: 0; overflow: hidden;
  background: var(--surface-2); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line));
  display: flex; align-items: center; justify-content: center;
}
html[data-theme="dark"] .logo { box-shadow: 0 0 0 1px rgba(230,196,140,.28), 0 0 18px 3px rgba(201,148,74,.32), 0 0 46px 12px rgba(201,148,74,.12); }
.logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
.logo .fb { display: none; font-size: 19px; color: var(--gold-d); }
.logo.nolog img { display: none; } .logo.nolog .fb { display: block; }
.bn { font-weight: 800; font-size: 18px; letter-spacing: .06em; line-height: 1; }
.bn em { font-style: normal; color: var(--gold-d); }
.bs { margin-top: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); font-variant-numeric: tabular-nums; text-transform: uppercase; }
.tools { display: flex; align-items: center; gap: 9px; padding: 7px 14px 9px; border-top: 1px solid var(--line); background: var(--surface-2); }
.st { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.grow { flex: 1; min-width: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #a2a9b3; flex-shrink: 0; }
.dot.ok { background: #5fbf6e; box-shadow: 0 0 0 3px rgba(95,191,110,.22), 0 0 8px #5fbf6e; animation: lampBreath 2.4s ease-in-out infinite; }
.dot.bad { background: var(--brick); box-shadow: 0 0 0 3px rgba(210,73,44,.22), 0 0 8px var(--brick); animation: lampBreath 1s ease-in-out infinite; }
@keyframes lampBreath { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* Công tắc sáng/tối (giống index) */
.theme-toggle-btn { position: relative; flex-shrink: 0; width: 54px; height: 28px; padding: 0; border: 0; background: none; }
.theme-toggle-track { position: relative; width: 100%; height: 100%; border-radius: 999px; display: flex; align-items: center; justify-content: space-between; padding: 0 7px;
  background: linear-gradient(180deg, #fdf6ea 0%, #f3e6cf 100%); border: 1px solid rgba(26,21,16,.10); box-shadow: inset 0 1px 3px rgba(26,21,16,.10); transition: background .4s, border-color .4s; }
.track-icon { display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; z-index: 1; }
.icon-sun { color: #C9944A; } .icon-sun svg { width: 14px; height: 14px; }
.icon-moon { color: #b9afa0; font-size: 12px; opacity: .7; }
.theme-toggle-thumb { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fffdf7 0%, #ffe9b8 45%, #E1B66E 100%); box-shadow: 0 2px 5px rgba(26,21,16,.25), 0 0 0 1px rgba(225,182,110,.4);
  display: flex; align-items: center; justify-content: center; transition: transform .35s cubic-bezier(.34,1.4,.64,1), background .4s; }
.thumb-sun { display: flex; width: 13px; height: 13px; color: #a9793a; } .thumb-sun svg { width: 13px; height: 13px; }
.thumb-moon { display: none; font-size: 11px; color: #E1B66E; }
html[data-theme="dark"] .theme-toggle-track { background: linear-gradient(180deg, #241c14 0%, #15110c 100%); border-color: rgba(230,196,140,.16); box-shadow: inset 0 1px 3px rgba(0,0,0,.5), 0 0 12px 1px rgba(201,148,74,.14); }
html[data-theme="dark"] .icon-sun { color: #6e685d; opacity: .55; } html[data-theme="dark"] .icon-moon { color: #E1B66E; opacity: 1; }
html[data-theme="dark"] .theme-toggle-thumb { transform: translateX(26px); background: radial-gradient(circle at 32% 28%, #3a2e20 0%, #241c14 100%); box-shadow: 0 2px 6px rgba(0,0,0,.5), 0 0 0 1px rgba(230,196,140,.25), 0 0 10px 1px rgba(201,148,74,.35); }
html[data-theme="dark"] .thumb-sun { display: none; } html[data-theme="dark"] .thumb-moon { display: flex; }

/* ---------- Khung nội dung ---------- */
#body { flex: 1; overflow-y: auto; overscroll-behavior: contain; width: 100%; max-width: 1160px; margin: 0 auto; padding: 16px 14px calc(var(--nav-h) + 34px + env(safe-area-inset-bottom)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
.sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.sec i { color: var(--gold-d); margin-right: 7px; }
.sec em { font-style: normal; font-weight: 700; letter-spacing: .02em; text-transform: none; color: var(--muted); }
.sec .tot { padding: 4px 11px; border-radius: 999px; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 40%, var(--line)); color: var(--gold-d); letter-spacing: 0; text-transform: none; font-size: 12px; font-variant-numeric: tabular-nums; }
.sell-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(310px, .9fr); gap: 16px; align-items: start; }
.sell-layout > aside { position: sticky; top: 0; }

/* Ô tìm món */
.srch { position: relative; margin-bottom: 14px; }
.srch i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }
.srch input { width: 100%; padding: 11px 14px 11px 35px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 13.5px; font-weight: 600; outline: none; transition: border-color .18s, box-shadow .18s; }
.srch input::placeholder { color: var(--muted); font-weight: 500; opacity: .7; }
.srch input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }

/* Thẻ món */
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.dish { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 11px; padding: 14px; min-height: 132px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); transition: transform .15s cubic-bezier(.4,0,.2,1), border-color .15s, box-shadow .2s; }
.dish:hover { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); }
.dish:active { transform: scale(.95); }
.dish.has { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 32%, transparent), var(--shadow); }
html[data-theme="dark"] .dish.has { box-shadow: 0 0 0 1px rgba(225,182,110,.5), 0 0 18px 2px rgba(201,148,74,.28); }
.dish-ic { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 17px; background: var(--gold-soft); color: var(--gold-d); border: 1px solid var(--line); }
.dish-nm { font-weight: 800; font-size: 14px; line-height: 1.3; letter-spacing: -.01em; }
.dish-ft { margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: space-between; }
.dish-pr { font-weight: 800; font-size: 16px; color: var(--gold-d); font-variant-numeric: tabular-nums; }
.dish-plus { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: var(--on-gold); display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 4px 10px -3px color-mix(in srgb, var(--gold) 70%, transparent); }
.dish-q { position: absolute; top: -8px; right: -6px; min-width: 25px; height: 25px; padding: 0 7px; border-radius: 999px; background: #2a1f14; color: #f6e7c8; border: 2px solid var(--bg); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-style: normal; }

/* ---------- Tờ bill ---------- */
.bill-shadow { position: relative; filter: drop-shadow(0 2px 3px rgba(60,40,15,.20)) drop-shadow(0 6px 10px rgba(60,40,15,.10)); }
html[data-theme="dark"] .bill-shadow { filter: drop-shadow(0 0 .6px rgba(225,182,110,.55)) drop-shadow(0 3px 6px rgba(0,0,0,.55)) drop-shadow(0 10px 18px rgba(201,148,74,.10)); }
.bill-wrap { --bill-tooth: 14px; padding-bottom: calc(var(--bill-tooth) / 2); border-radius: 5px 5px 0 0;
  background: radial-gradient(rgba(120,90,50,.055) 1px, transparent 1.4px) 0 0 / 5px 5px, linear-gradient(180deg, #fffdf6 0%, #fbf5e6 100%);
  -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / var(--bill-tooth) 100%; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / var(--bill-tooth) 100%; }
html[data-theme="dark"] .bill-wrap { background: radial-gradient(rgba(230,196,140,.05) 1px, transparent 1.4px) 0 0 / 5px 5px, linear-gradient(180deg, rgba(255,226,170,.07) 0, rgba(255,226,170,0) 26px), linear-gradient(180deg, #3a2d20 0%, #2c2218 100%); }
.bill-scroll { min-height: 70px; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; padding: 0 14px; color: #2b2118; font-size: 13px; scrollbar-width: thin; scrollbar-color: #d6c9ae transparent; }
html[data-theme="dark"] .bill-scroll { color: #f1e6d2; scrollbar-color: #6b5538 transparent; }
.bill-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 11px 0 7px; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #8a7a62; border-bottom: 1.5px dashed rgba(90,65,35,.30); }
.bill-head b { color: #5b3f1c; font-weight: 800; }
html[data-theme="dark"] .bill-head { color: #a8977a; border-bottom-color: rgba(230,196,140,.28); }
html[data-theme="dark"] .bill-head b { color: #E1B66E; }
.bill-row { display: flex; align-items: center; gap: 2px; padding: 6px 0 1px; }
.bill-line { flex: 1; min-width: 0; display: flex; align-items: baseline; }
.bill-name { min-width: 0; max-width: 68%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; color: #2b2118; }
html[data-theme="dark"] .bill-name { color: #f4ead7; }
.bill-leader { flex: 1; min-width: 14px; margin: 0 6px; border-bottom: 2px dotted rgba(90,65,35,.38); position: relative; top: -3px; }
html[data-theme="dark"] .bill-leader { border-bottom-color: rgba(230,196,140,.34); }
.bill-price { flex-shrink: 0; font-weight: 800; color: #7a4a14; font-variant-numeric: tabular-nums; }
html[data-theme="dark"] .bill-price { color: #E1B66E; }
.bill-btn { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: 0; padding: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #a89a82; transition: color .15s, background-color .15s; }
.bill-btn:hover { background: rgba(120,90,50,.10); color: #4f4a41; }
.bill-btn.bill-btn-on { color: #b9803d; }
.bill-btn.bill-btn-x:hover { color: #b23a22; background: rgba(178,58,34,.10); }
html[data-theme="dark"] .bill-btn { color: #8f7e63; }
html[data-theme="dark"] .bill-btn:hover { background: rgba(230,196,140,.12); color: #f1e6d2; }
html[data-theme="dark"] .bill-btn.bill-btn-on { color: #E1B66E; }
html[data-theme="dark"] .bill-btn.bill-btn-x:hover { color: #ff9b83; background: rgba(217,119,87,.16); }
.bill-note { display: block; width: calc(100% - 8px); margin: 0 0 1px 8px; padding: 0 0 0 7px; background: none; border: 0; border-left: 2px solid rgba(185,128,61,.45); font: inherit; font-size: 11px; line-height: 1.25; font-style: italic; color: #8a5a1f; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html[data-theme="dark"] .bill-note { color: #d9a95c; border-left-color: rgba(225,182,110,.5); }
.bill-note-input { display: block; width: calc(100% - 8px); margin: 2px 0 4px 8px; padding: 4px 2px; background: transparent; border: 0; border-bottom: 1.5px dashed #b9803d; border-radius: 0; font: inherit; font-size: 12px; font-style: italic; color: #2b2118; outline: none; }
.bill-note-input:focus { border-bottom-style: solid; background: rgba(201,148,74,.08); }
.bill-note-input::placeholder { color: #b3a58c; }
html[data-theme="dark"] .bill-note-input { color: #f4ead7; border-bottom-color: #C9944A; }
html[data-theme="dark"] .bill-note-input::placeholder { color: #7f6f56; }
.bill-empty { text-align: center; padding: 22px 0 18px; color: #a39580; }
.bill-empty i { display: block; font-size: 20px; margin-bottom: 6px; opacity: .55; }
.bill-empty span { font-size: 12px; font-style: italic; }
html[data-theme="dark"] .bill-empty { color: #8f7e63; }
.bill-total { position: sticky; bottom: 0; z-index: 2; margin-top: 6px; padding: 8px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; background: linear-gradient(180deg, #fbf6e8, #fbf5e6); border-top: 3px double rgba(90,65,35,.45); }
html[data-theme="dark"] .bill-total { background: linear-gradient(180deg, #2f241a, #2c2218); border-top-color: rgba(225,182,110,.55); }
.bill-total-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5b3f1c; }
.bill-total-label small { font-weight: 600; letter-spacing: .02em; text-transform: none; color: #9a8a70; margin-left: 4px; }
html[data-theme="dark"] .bill-total-label { color: #E1B66E; } html[data-theme="dark"] .bill-total-label small { color: #a8977a; }
.bill-total-val { font-size: 21px; font-weight: 800; line-height: 1; color: #1a1510; font-variant-numeric: tabular-nums; }
html[data-theme="dark"] .bill-total-val { color: #ffe9b8; text-shadow: 0 0 12px rgba(225,182,110,.35); }

/* Ghi chú đơn + chọn thanh toán */
.fld { margin-top: 14px; }
.fld label { display: block; margin-bottom: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.fld input { width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; font-weight: 600; outline: none; }
.fld input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.segb { padding: 11px 8px; border: 0; border-radius: 12px; background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 800; transition: background .18s, color .18s, transform .12s; }
.segb:active { transform: scale(.96); }
.segb.on { background: var(--gold); color: var(--on-gold); box-shadow: 0 4px 12px -4px color-mix(in srgb, var(--gold) 70%, transparent); }
.segb i { margin-right: 6px; }

/* Nút Thu tiền (cùng phong cách .pay-pill của index) */
.pay-big { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 14px; padding: 8px 20px 8px 8px; border: 0; border-radius: 999px; color: #fff; text-align: left;
  background: linear-gradient(135deg, #52a042, #2f7a28); box-shadow: 0 6px 16px rgba(47,122,40,.38), inset 0 1px 0 rgba(255,255,255,.28); transition: transform .12s, filter .15s; animation: payGlow 2.6s ease-in-out infinite; }
.pay-big:hover { filter: brightness(1.07); } .pay-big:active { transform: scale(.97); }
.pay-big .ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.22); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.pay-big .tx { flex: 1; display: flex; flex-direction: column; line-height: 1.15; }
.pay-big .tx b { font-size: 15px; font-weight: 800; letter-spacing: .06em; }
.pay-big .tx small { font-size: 11px; font-weight: 700; opacity: .9; }
.pay-big .amt { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
@keyframes payGlow { 0%,100% { box-shadow: 0 6px 16px rgba(47,122,40,.38), inset 0 1px 0 rgba(255,255,255,.28); } 50% { box-shadow: 0 6px 24px rgba(82,160,66,.65), inset 0 1px 0 rgba(255,255,255,.28); } }
html[data-theme="dark"] .pay-big { color: #10200a; background: linear-gradient(135deg, #86c660, #5C8A41); box-shadow: 0 4px 16px rgba(111,168,78,.35), inset 0 1px 0 rgba(255,255,255,.3); }
html[data-theme="dark"] .pay-big .ic { background: rgba(16,32,10,.18); }

    }
    function stats() {
        var d0 = new Date().setHours(0, 0, 0, 0), by = {}, cash = 0, bank = 0, sum = 0, n = 0, oq = 0, ov = 0;
        var row = function (k) { return by[k] || (by[k] = { a: 0, b: 0 }); };
        S.ledger.filter(function (x) { return x.at >= d0; }).forEach(function (x) { sum += x.total; if (x.pay === 'bank') bank += x.total; else cash += x.total; n++; x.lines.forEach(function (l) { row(l.n).a += l.q; }); });
        S.orders.filter(function (o) { return o.at >= d0; }).forEach(function (o) {
            (o.a || []).forEach(function (i) { row(i.n).b += i.q; oq += i.q; ov += unit(i) * i.q; });
            (o.r || []).forEach(function (i) { row(i.n).b -= i.q; oq -= i.q; ov -= unit(i) * i.q; });
        });
        return { sum: sum, cash: cash, bank: bank, n: n, oq: oq, ov: ov, by: by };
    }
    function vRev() {
        var s = stats(), keys = Object.keys(s.by), mx = 1;
        keys.forEach(function (k) { mx = Math.max(mx, s.by[k].a + Math.max(0, s.by[k].b)); });
        keys.sort(function (x, y) { return (s.by[y].a + s.by[y].b) - (s.by[x].a + s.by[x].b); });
        var rows = keys.map(function (k) {
            var a = s.by[k].a, b = Math.max(0, s.by[k].b);
            return '<div class="brow"><div class="t"><span>' + esc(k) + '</span><em>' + (a + s.by[k].b) + ' cái</em></div>' +
                '<div class="bar"><i class="a" style="width:' + (a / mx * 100) + '%"></i><i class="b" style="width:' + (b / mx * 100) + '%"></i></div>' +
                '<div class="t" style="margin-top:5px"><em>Bán tại xe ' + a + '</em><em>Qua bàn ' + s.by[k].b + '</em></div></div>';
        }).join('');
        return '<div class="hero"><div class="lab"><i class="fa-solid fa-sun"></i>Hôm nay · bán tại xe</div><div class="big">' + money(s.sum) + '</div><div class="sub">' + s.n + ' đơn đã thu</div></div>' +
            '<div class="stats2"><div class="stat cash"><div class="ico"><i class="fa-solid fa-money-bill-wave"></i></div><div class="l">Tiền mặt</div><div class="v">' + money(s.cash) + '</div></div>' +
            '<div class="stat bank"><div class="ico"><i class="fa-solid fa-qrcode"></i></div><div class="l">Chuyển khoản</div><div class="v">' + money(s.bank) + '</div></div></div>' +
            '<div class="tableinfo"><div class="ico"><i class="fa-solid fa-utensils"></i></div><div><b>' + s.oq + ' cái · ' + money(s.ov) + '</b><span>Bánh mì qua bàn (thu ở quán) — đã nằm trong bill bàn, KHÔNG thu lại ở xe, chỉ để đối chiếu.</span></div></div>' +
            '<div class="panel" style="margin-top:12px"><div class="sec"><span><i class="fa-solid fa-chart-simple"></i>Chi tiết từng món</span></div>' +
            (rows || '<span style="color:var(--muted);font-size:13px">Chưa có số liệu</span>') +
            (rows ? '<div class="legend"><span class="la">Bán tại xe</span><span class="lb">Qua bàn</span></div>' : '') + '</div>' +
            '<button class="pay-big gold" data-report><span class="ic"><i class="fa-solid fa-paper-plane"></i></span><span class="tx"><b>CHỐT XE</b><small>Gửi báo cáo cho thu ngân</small></span><i class="fa-solid fa-chevron-right"></i></button>';
    }
    function report() {
        var s = stats(), msg = ['🥖 Bán tại xe: ' + money(s.sum) + ' (' + s.n + ' đơn)', '💵 Tiền mặt cần nộp: ' + money(s.cash), '🏦 Chuyển khoản: ' + money(s.bank), '🪑 Bánh mì qua bàn (đã tính trong bill quán): ' + s.oq + ' cái · ' + money(s.ov), '🕒 ' + hm(Date.now()) + (who ? ' · 👤 ' + who : '')];
        sendNotice('🥖 CHỐT XE BÁNH MÌ', msg, 3, { label: 'Chốt xe', noStaff: true });
        banner('Đang gửi báo cáo cho thu ngân…', true);
    }
    document.body.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var d = b.dataset;
        if (d.tab) S.tab = d.tab;
        else if (d.add) { S.cart.push({ n: d.add, p: price(d.add), note: '' }); }
        else if (d.rm !== undefined) { S.cart.splice(+d.rm, 1); editIdx = null; }
        else if (d.note !== undefined) { editIdx = (editIdx === +d.note) ? null : +d.note; }
        else if (d.clear !== undefined) { S.cart = []; S.cartNote = ''; editIdx = null; }
        else if (d.pay === 'cash' || d.pay === 'bank') pay = d.pay;
        else if (d.pay === 'go') {
            var gm = {}, ls = []; S.cart.forEach(function (it) { var k = it.n + '|' + (it.note || ''); if (!gm[k]) { gm[k] = { n: it.n, q: 0, p: (it.p > 0 ? it.p : price(it.n)), note: it.note || '' }; ls.push(gm[k]); } gm[k].q++; });
            var tot = cartTotal();
            if (!ls.length) return;
            S.ledger.push({ id: 'x' + Date.now().toString(36), at: Date.now(), lines: ls, total: tot, pay: pay, by: who, note: S.cartNote || '' });
            notifySale(S.ledger[S.ledger.length - 1]); S.cart = []; S.cartNote = ''; editIdx = null; banner('Đã thu ' + money(tot) + (pay === 'bank' ? ' (chuyển khoản)' : ''), true); pay = 'cash';
        }
        else if (d.undo !== undefined) { if (confirm('Hoàn tác đơn vừa thu?')) notifyUndo(S.ledger.pop()); else return; }
        else if (d.st) { var p = d.st.split('|'), o = S.orders.filter(function (x) { return x.id === p[0]; })[0]; if (o) { o.st = p[1]; if (p[1] === 'done') pub(TOPIC_OUT, { t: o.t, by: o.by || '', id: o.id, dev: dev, at: Date.now() }); } }
        else if (d.resend !== undefined) { retryNow(); return; }
        else if (d.silence !== undefined) { silenceAll(); return; }
        else if (d.report !== undefined) { report(); return; }
        else if (d.jump !== undefined) { var rc = $('receipt'); if (rc) rc.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        else return;
        save(); render();
    });
    document.body.addEventListener('input', function (e) {
        var t = e.target;
        if (t.id === 'itemNoteInput') { var it = S.cart[editIdx]; if (it) { it.note = t.value.slice(0, 60); save(); } }
        else if (t.id === 'cartNoteInput') { S.cartNote = t.value.slice(0, 80); save(); }
        else if (t.id === 'menuSearch') { searchQ = t.value; filterMenu(); }
    });
    document.body.addEventListener('keydown', function (e) { if (e.target.id === 'itemNoteInput' && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); editIdx = null; render(); } });
    document.body.addEventListener('focusout', function (e) { if (e.target.id === 'itemNoteInput') { var i0 = editIdx; setTimeout(function () { if (editIdx === i0 && i0 != null) { editIdx = null; render(); } }, 200); } });
    themeSync(); paintWho(); render(); pump();
    (function clk() { var d = new Date(); $('clk').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' · ' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); setTimeout(clk, 20000); })();
    if (!who) setTimeout(askWho, 400);
})();
</script>
</body>
</html>
