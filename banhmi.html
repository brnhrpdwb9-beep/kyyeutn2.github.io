<style>

:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --text: #20242b;
  --muted: #737b87;
  --line: #e5e8ed;
  --accent: #b77935;
  --accent-soft: #f7eee3;
  --success: #247a50;
  --success-soft: #e8f4ed;
  --danger: #c3473d;
  --danger-soft: #faecea;
  --ink: #ffffff;
  --shadow: 0 2px 8px rgba(22, 30, 42, .045);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #15181d;
  --surface: #20242b;
  --surface-2: #292e36;
  --text: #f0f2f5;
  --muted: #a0a8b4;
  --line: #353c46;
  --accent: #d29a5c;
  --accent-soft: #3a3025;
  --success: #65bd8c;
  --success-soft: #20392d;
  --danger: #ed8178;
  --danger-soft: #422b2b;
  --ink: #17191d;
  --shadow: 0 2px 10px rgba(0,0,0,.16);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
  font-size: 15px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.hd {
  flex-shrink: 0; position: relative; z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.mast {
  position: relative; display: flex; align-items: center; justify-content: flex-start;
  gap: 14px; padding: calc(14px + env(safe-area-inset-top)) max(18px, calc((100vw - 1160px)/2)) 12px;
  border: 0; background: var(--surface);
}
.mast .back { position: static; order: 0; }
.brand { display: flex; align-items: center; gap: 11px; }
.logo {
  width: 42px; height: 42px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface-2); display: flex; align-items: center; justify-content: center;
  overflow: hidden; flex-shrink: 0; box-shadow: none;
}
.logo img { width: 100%; height: 100%; object-fit: contain; padding: 5px; }
.logo .fb { display: none; font-size: 18px; color: var(--accent); }
.logo.nolog img { display: none; } .logo.nolog .fb { display: block; }
.bn { font-weight: 800; font-size: 18px; letter-spacing: .075em; line-height: 1.05; }
.bn em { font-style: normal; color: var(--accent); }
.bs { margin-top: 4px; font-size: 11px; font-weight: 600; letter-spacing: .035em; color: var(--muted); }
.mast .whoBtn { position: static; margin-left: auto; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools {
  display: flex; align-items: center; gap: 9px; max-width: 1160px;
  margin: 0 auto; width: 100%; padding: 0 18px 10px;
}
.st { font-size: 12px; font-weight: 600; color: var(--muted); }
.row { display: flex; align-items: center; gap: 9px; }
.grow { flex: 1; min-width: 0; }
.ttl { font-weight: 750; font-size: 16px; letter-spacing: -.02em; }
.mut { color: var(--muted); font-size: 12px; }
.ibtn {
  min-width: 38px; height: 38px; padding: 0 10px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); font-size: 13px;
  font-weight: 650; flex-shrink: 0; transition: background .15s, border-color .15s;
}
.ibtn:hover { background: var(--surface-2); border-color: #cbd1da; }
.ibtn:active, .btn:active, .item:active, .chip:active { transform: translateY(1px); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #a2a9b3; flex-shrink: 0; }
.dot.ok { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.dot.bad { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.tabs {
  display: flex; gap: 4px; max-width: 1160px; margin: 0 auto;
  padding: 0 18px; border-top: 1px solid var(--line);
}
.hd .tabs { padding-top: 7px; }
.chip {
  position: relative; flex: 0 0 auto; min-width: 116px; text-align: center;
  padding: 11px 14px 10px; border-radius: 0; border: 0;
  border-bottom: 2px solid transparent; background: transparent;
  color: var(--muted); font-size: 13px; font-weight: 650;
}
.chip:hover { color: var(--text); background: var(--surface-2); }
.chip.on { color: var(--accent); background: transparent; border-bottom-color: var(--accent); }
.hd .chip i { display: inline-block; font-size: 13px; margin: 0 7px 0 0; }
.hd .chip b {
  position: absolute; top: 5px; right: 7px; margin: 0; padding: 1px 5px;
  border-radius: 20px; background: var(--danger); color: white; font-size: 10px;
}
.chip b { margin-left: 5px; padding: 1px 6px; border-radius: 20px; background: var(--danger); color: #fff; font-size: 10px; }
#body {
  flex: 1; overflow-y: auto; overscroll-behavior: contain;
  width: 100%; max-width: 1160px; margin: 0 auto;
  padding: 22px 18px calc(28px + env(safe-area-inset-bottom));
}
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 17px; margin-bottom: 12px; box-shadow: var(--shadow);
}
.card.hot { border: 1px solid color-mix(in srgb, var(--accent) 58%, var(--line)); border-left: 3px solid var(--accent); }
.item {
  position: relative; text-align: left; background: var(--surface); color: var(--text);
  border: 1px solid var(--line); border-radius: 11px; padding: 15px;
  min-height: 126px; box-shadow: none; transition: border-color .15s, background .15s;
}
.item:hover { border-color: var(--accent); background: var(--surface-2); }
.ic {
  width: 34px; height: 34px; border-radius: 9px; margin-bottom: 13px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent); font-size: 15px;
}
.item b { display: block; font-size: 14px; font-weight: 700; line-height: 1.35; }
.item span { display: block; margin-top: 6px; color: var(--accent); font-size: 13px; font-weight: 750; }
.qty {
  position: absolute; top: 10px; right: 10px; min-width: 23px; height: 23px;
  padding: 0 6px; border-radius: 7px; background: var(--text); color: var(--surface);
  font-size: 12px; font-weight: 750; display: flex; align-items: center; justify-content: center;
}
.sell-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); gap: 16px; align-items: start; }
.sell-layout > .grid { align-content: start; }
.sell-layout > .card { margin: 0; position: sticky; top: 0; }
.btn {
  width: 100%; margin-top: 10px; padding: 12px 15px; border: 1px solid transparent;
  border-radius: 9px; font-weight: 700; font-size: 13px; min-height: 43px;
  transition: filter .15s, transform .15s;
}
.btn:hover { filter: brightness(.97); }
.btn.gold { background: var(--accent); color: #fff; }
.btn.ok { background: var(--success); color: #fff; }
.btn.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-weight: 650; font-size: 12px; padding: 9px 12px; }
.lab { font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .075em; color: var(--muted); }
.big { font-size: 29px; line-height: 1.15; font-weight: 800; letter-spacing: -.04em; margin-top: 7px; }
.sp { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; font-size: 13px; border-bottom: 1px solid var(--line); }
.sp:last-child { border-bottom: 0; }
.bad { color: var(--danger); }
.empty {
  text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7;
  margin: 32px auto; max-width: 360px; padding: 28px 18px;
  background: var(--surface); border: 1px dashed var(--line); border-radius: 12px;
}
#ban { position: fixed; top: 0; left: 0; right: 0; z-index: 50; padding: calc(12px + env(safe-area-inset-top)) 12px 0; display: none; }
#ban div {
  max-width: 440px; margin: 0 auto; padding: 13px 16px; border-radius: 10px;
  font-weight: 700; font-size: 13px; box-shadow: 0 8px 28px rgba(0,0,0,.18);
  background: var(--text); color: var(--surface);
}
#ban div.ok { background: var(--success); color: #fff; }
.theme-toggle-btn { position: relative; flex-shrink: 0; width: 42px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--surface-2); cursor: pointer; }
.theme-toggle-track { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: space-around; }
.theme-toggle-track .track-icon { display: flex; align-items: center; justify-content: center; width: 14px; height: 14px; position: relative; z-index: 1; font-size: 11px; color: var(--muted); }
.theme-toggle-track .track-icon.icon-sun { color: var(--accent); }
.theme-toggle-track .track-icon.icon-sun svg { width: 13px; height: 13px; }
.theme-toggle-thumb {
  position: absolute; top: 2px; left: 2px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 1px 3px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: center;
  transform: translateX(0); transition: transform .2s ease;
}
html[data-theme="dark"] .theme-toggle-thumb { transform: translateX(12px); }
.theme-toggle-thumb .thumb-sun, .theme-toggle-thumb .thumb-moon { display: none; align-items: center; justify-content: center; width: 14px; height: 14px; font-size: 11px; }
html:not([data-theme="dark"]) .theme-toggle-thumb .thumb-sun { display: flex; color: var(--accent); }
html[data-theme="dark"] .theme-toggle-thumb .thumb-moon { display: flex; color: var(--accent); }
.theme-toggle-thumb .thumb-sun svg { width: 13px; height: 13px; }
@media (max-width: 760px) {
  .mast { padding-left: 12px; padding-right: 12px; }
  .tools { padding-left: 14px; padding-right: 14px; }
  .tabs { padding-left: 12px; padding-right: 12px; }
  #body { padding: 15px 12px calc(22px + env(safe-area-inset-bottom)); }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .sell-layout { grid-template-columns: 1fr; gap: 12px; }
  .sell-layout > .card { position: static; }
  .item { min-height: 116px; padding: 12px; }
  .card { padding: 14px; }
}
@media (max-width: 380px) {
  .bn { font-size: 16px; }
  .logo { width: 38px; height: 38px; }
  .chip { min-width: 0; flex: 1; padding-left: 6px; padding-right: 6px; font-size: 11px; }
  .hd .chip i { margin-right: 4px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

#gbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: none; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #b91c1c; color: #fff; font-size: 13px; font-weight: 700; box-shadow: 0 -6px 24px rgba(0,0,0,.2); }
#gbar .in { max-width: 1160px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
#gbar .msg { flex: 1; min-width: 200px; }
#gbar button { padding: 9px 14px; border-radius: 8px; border: 0; background: #fff; color: #b91c1c; font-weight: 750; font-size: 12px; }
#gbar button.g { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6); }
.sec { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.sec i { color: var(--accent); margin-right: 6px; }
.srch { position: relative; margin-bottom: 10px; }
.srch i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; }
.srch input, .fld input { width: 100%; padding: 9px 12px 9px 32px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); color: var(--text); font: inherit; font-size: 13px; outline: none; }
.fld { margin-top: 12px; } .fld input { padding-left: 12px; }
.fld label { display: block; margin-bottom: 4px; font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.srch input:focus, .fld input:focus { border-color: var(--accent); }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mi { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 650; font-size: 13px; text-align: left; transition: border-color .15s, background .15s; }
.mi:hover { border-color: var(--accent); background: var(--accent-soft); }
.mi:active { transform: translateY(1px); }
.mi .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .nm i { color: var(--accent); margin-right: 6px; }
.mi .pr { color: var(--accent); font-weight: 800; flex-shrink: 0; }
.mi .qty { top: -7px; right: -7px; }
.payrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.paybtn { padding: 10px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--muted); }
.paybtn.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
/* ===== Tờ bill "Món đã gọi" (giống trang order nước) ===== */
.bill-shadow { position: relative; filter: drop-shadow(0 2px 3px rgba(60,40,15,.20)) drop-shadow(0 6px 10px rgba(60,40,15,.10)); }

<body>
<!-- ============================================================
     TRANG XE BÁNH MÌ — file RIÊNG, đặt CÙNG THƯ MỤC với index.html. Mở máy xe bằng banhmi.html (thêm vào màn hình chính cho tiện).
     - "Bán tại xe": khách đi ngang mua bánh mì, thu tiền, ghi sổ riêng của xe (lưu trên máy xe).
     - "Đơn từ quán": phục vụ gọi món có BÁNH MÌ trong index.html thì đơn tự bay sang đây (ntfy). Xe bấm Nhận làm → Xong
       thì máy phục vụ hiện banner "bánh mì bàn X đã xong". Tiền các đơn này vẫn thu trong bill bàn ở quán.
     - "Doanh thu": tổng kết riêng của xe trong ngày + gửi báo cáo chốt xe cho thu ngân (qua Worker Telegram sẵn có).
     PHẢI GIỐNG index.html: TOPIC_IN, TOPIC_OUT, NOTIFY_WORKER_URL, NOTIFY_KEY.
     XE_MENU: món xe bán trực tiếp (price = nghìn đồng). Món bánh mì để phục vụ gọi nằm ở MENU_DATA trong index.html — giữ tên khớp nhau.
     ============================================================ -->

<script>
(function () {
    'use strict';
    var TOPIC_IN = 'tys-xe-order-b4n8m1q6w3', TOPIC_OUT = 'tys-xe-ready-b4n8m1q6w3', NTFY = 'https://ntfy.sh/', SK = 'tys_xe_v1';
    var NOTIFY_WORKER_URL = 'https://falling-tooth-d67e.brnhrpdwb9.workers.dev', NOTIFY_KEY = '6dd81ad0b4ba8b3d5fc58d37';
    var XE_MENU = [
        { name: 'Bánh Mì Thịt', price: 20 }, { name: 'Bánh Mì Chả', price: 18 },
        { name: 'Bánh Mì Trứng Ốp La', price: 18 }, { name: 'Bánh Mì Đặc Biệt', price: 25 }
    ];
    var $ = function (id) { return document.getElementById(id); };
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var dev = (function () { try { var d = localStorage.getItem(SK + '_dev'); if (!d) { d = Math.random().toString(36).slice(2, 9); localStorage.setItem(SK + '_dev', d); } return d; } catch (e) { return 'x'; } })();
    var S; try { S = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) {}
    S = S || {}; S.ledger = S.ledger || []; S.orders = S.orders || []; S.cart = S.cart || [];
    if (!Array.isArray(S.cart)) { var oc = S.cart, na = []; Object.keys(oc).forEach(function (k) { for (var q = 0; q < oc[k]; q++) na.push({ n: k, p: 0, note: '' }); }); S.cart = na; }
    S.cartNote = S.cartNote || ''; S.tab = S.tab || 'sell'; S.seenMv = S.seenMv || {};
    var pay = 'cash', who = '', editIdx = null, searchQ = '';
    try { who = localStorage.getItem(SK + '_who') || ''; } catch (e) {}
    function save() { var lim = Date.now() - 60 * 864e5; S.ledger = S.ledger.filter(function (x) { return x.at > lim; }).slice(-3000); S.orders = S.orders.slice(-300); try { localStorage.setItem(SK, JSON.stringify(S)); } catch (e) {} }
    function price(n) { var m = XE_MENU.filter(function (x) { return x.name === n; })[0]; return m ? m.price : 0; }
    function unit(i) { return i.p != null ? i.p : price(i.n); }
    function money(k) { return ((k || 0) * 1000).toLocaleString('vi-VN') + 'đ'; }
    function hm(t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
    function beep() { try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = .15; o.start(); o.stop(c.currentTime + .25); if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {} }
    function banner(txt, ok) { var b = $('ban'); b.innerHTML = '<div class="' + (ok ? 'ok' : '') + '">' + esc(txt) + '</div>'; b.style.display = 'block'; clearTimeout(banner.t); banner.t = setTimeout(function () { b.style.display = 'none'; }, 9000); }

    /* ---------- THÔNG BÁO TELEGRAM CHO THU NGÂN (giống các món nước ở index.html) ----------
       Gửi qua Worker /notify (Worker tự nhân bản sang 2 nhóm, nhóm phụ kêu chuông trên máy POS, tin có nút bấm cho thu ngân).
       Có hộp thư đi: mất mạng / tắt app mở lại vẫn gửi bù; lỗi thì thử lại 3s, 8s, 20s, 45s, rồi mỗi 60s.
       Chuông ntfy trên máy POS: topic POS_BELL_TOPIC (phải trùng NTFY_TOPIC trong index.html).
       XE_ACK_TABLE: PHẢI là null. Worker và index.html chỉ hiểu số bàn thật (1..TOTAL_TABLES); gắn chữ như 'XE' sẽ lỗi "không có số bàn" khi thu ngân bấm nút. */
    var POS_BELL_TOPIC = 'tys-pos-order-k7q3m9x2d8f4', BELL_MSG = 'Có order mới', XE_ACK_TABLE = null, bellAt = 0;
    var GUARD = { retry: [3000, 8000, 20000, 45000, 60000], timeout: 12000, maxAge: 30 * 60000, pruneAge: 3 * 3600000, maxInflight: 4 };
    var OB_KEY = SK + '_outbox', flying = {};
    var outbox = (function () {
        try { var a = JSON.parse(localStorage.getItem(OB_KEY) || '[]'), now = Date.now(); return (Array.isArray(a) ? a : []).filter(function (j) { return j && j.id && now - j.at < GUARD.pruneAge; }); } catch (e) { return []; }
    })();
    function obSave() { try { localStorage.setItem(OB_KEY, JSON.stringify(outbox.slice(-30))); } catch (e) {} }
    function ntfyBell() {
        try {
            if (Date.now() - bellAt < 4000) return; bellAt = Date.now();
            var send = function () { return fetch(NTFY + encodeURIComponent(POS_BELL_TOPIC), { method: 'POST', body: BELL_MSG, headers: { Priority: 'high' }, keepalive: true }); };
            send().catch(function () { setTimeout(function () { send().catch(function () {}); }, 3000); });
        } catch (e) {}
    }
    function jobState(j) { if (j.ok) return 'sent'; if (j.fails > 0 || j.dead || Date.now() - j.at > 8000) return 'unsent'; return 'sending'; }
    function attempt(job) {
        flying[job.id] = true; job.tries++;
        var age = Date.now() - job.at;
        var message = age > 60000 ? '⏱ GỬI TRỄ ' + Math.round(age / 60000) + ' phút (đơn lúc ' + hm(job.at) + ')\n' + job.msg : job.msg;
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var timer = setTimeout(function () { try { if (ctl) ctl.abort(); } catch (e) {} }, GUARD.timeout), pr;
        try {
            pr = fetch(NOTIFY_WORKER_URL.replace(/\/+$/, '') + '/notify', {
                method: 'POST', keepalive: true, signal: ctl ? ctl.signal : undefined, headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ key: NOTIFY_KEY, title: job.title, message: message, priority: job.pr, id: job.id, at: job.at, table: job.table || null, sync: !!job.sync })
            });
        } catch (e) { pr = Promise.reject(e); }
        pr.then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); job.ok = true; job.sentAt = Date.now(); })
            .catch(function () {
                job.fails++;
                var w = GUARD.retry[Math.min(job.tries - 1, GUARD.retry.length - 1)];
                job.nx = Date.now() + w;
                setTimeout(function () { try { pump(); } catch (e) {} }, w + 30);
            })
            .then(function () { clearTimeout(timer); delete flying[job.id]; pump(); });
    }
    function pump() {
        var now = Date.now(), n = Object.keys(flying).length, q = [];
        outbox.forEach(function (j) {
            if (j.ok || j.dead || flying[j.id]) return;
            if (now - j.at > GUARD.maxAge) { j.dead = true; return; }
            if (now < (j.nx || 0)) return;
            q.push(j);
        });
        q.sort(function (a, b) { return (b.pr || 4) - (a.pr || 4) || a.at - b.at; });
        for (var i = 0; i < q.length && n < GUARD.maxInflight; i++, n++) attempt(q[i]);
        outbox = outbox.filter(function (j) { return !j.ok && !(j.dead && j.silenced); });
        obSave(); paintWarn();
    }
    function retryNow() { outbox.forEach(function (j) { if (!j.ok) { j.dead = false; j.nx = 0; j.at = Math.max(j.at, Date.now() - GUARD.maxAge + 120000); } }); pump(); }
    function silenceAll() { outbox.forEach(function (j) { if (!j.ok) j.silenced = true; }); pump(); }
    function paintWarn() {
        var bad = outbox.filter(function (j) { return !j.silenced && !j.sync && jobState(j) === 'unsent'; }), bar = $('gbar');
        if (!bar) { bar = document.createElement('div'); bar.id = 'gbar'; document.body.appendChild(bar); }
        if (!bad.length) { bar.style.display = 'none'; return; }
        var labels = []; bad.forEach(function (j) { if (labels.indexOf(j.label) < 0) labels.push(j.label); });
        bar.innerHTML = '<div class="in"><div class="msg">📤 CHƯA GỬI ĐƯỢC cho thu ngân: ' + esc(labels.slice(0, 3).join(', ')) + (labels.length > 3 ? ' +' + (labels.length - 3) : '') + ' — đang thử lại. Hãy báo miệng!</div>' +
            '<button type="button" data-resend>Gửi lại ngay</button><button type="button" class="g" data-silence>Đã báo miệng</button></div>';
        bar.style.display = 'block';
    }
    /* Gửi 1 thông báo tới thu ngân. opts: id, label, table (gắn nút bấm), sync, noStaff */
    function sendNotice(title, parts, priority, opts) {
        opts = opts || {};
        if (who && !opts.noStaff) parts = parts.concat(['👤 Nhân viên xe: ' + who]);
        var job = { id: opts.id || ('j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6)), title: title, msg: parts.join('\n'), pr: priority || 4,
            at: Date.now(), table: opts.table || null, sync: !!opts.sync, label: opts.label || String(title).slice(0, 28), ok: false, tries: 0, fails: 0, nx: 0 };
        outbox.push(job); obSave(); pump();
        return job.id;
    }
    function groupLines(ls) { return ls.map(function (l) { return l.q + ' × ' + l.n + (l.note ? ' — 📝 ' + l.note : ''); }); }
    /* Khách mua tại xe -> báo thu ngân ngay (tin + nút bấm + chuông máy POS) */
    function notifySale(x) {
        try {
            var n = 0; x.lines.forEach(function (l) { n += l.q; });
            sendNotice('🥖 XE · BÁN MỚI · ' + n + ' món' + (x.pay === 'bank' ? ' · CHUYỂN KHOẢN' : ' · TIỀN MẶT'), groupLines(x.lines).concat([
                '━━━━━━━━━━━━'].concat(x.note ? ['📝 ' + x.note] : [], ['🧾 ' + n + ' món · ' + money(x.total),
                x.pay === 'bank' ? '🏦 Chuyển khoản — kiểm tra tiền vào tài khoản' : '💵 Tiền mặt — xe giữ, nộp khi chốt xe',
                '🕒 ' + hm(x.at)
            ])), 4, { id: 'n' + x.id, label: 'Bán xe', table: XE_ACK_TABLE });
            ntfyBell();
        } catch (e) {}
    }
    function notifyUndo(x) {
        try {
            if (!x) return;
            sendNotice('↩️ XE · HỦY ĐƠN VỪA THU · ' + money(x.total), ['❌ Hủy đơn đã báo lúc ' + hm(x.at) + ':'].concat(groupLines(x.lines), ['━━━━━━━━━━━━', '🧾 ' + money(x.total) + (x.pay === 'bank' ? ' · chuyển khoản' : ' · tiền mặt'), '🕒 ' + hm(Date.now())]),
                5, { id: 'u' + x.id + Date.now().toString(36), label: 'Hủy đơn xe', table: XE_ACK_TABLE });
        } catch (e) {}
    }
    (function () {
        function wake() { retryNow(); }
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wake(); });
        window.addEventListener('pageshow', wake); window.addEventListener('online', wake); window.addEventListener('load', wake);
        setInterval(function () { pump(); }, 3000);
    })();

    /* ---------- Sáng / Tối (dùng chung khóa tysTheme với index.html) ---------- */
    function themeSync() { $('themeToggleBtn').setAttribute('aria-checked', document.documentElement.getAttribute('data-theme') === 'dark' ? 'true' : 'false'); }
    $('themeToggleBtn').onclick = function () {
        var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        try { localStorage.setItem('tysTheme', t); } catch (e) {}
        themeSync(); if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
    };
    /* ---------- Tên nhân viên ---------- */
    function askWho() { var n = prompt('Tên nhân viên xe:', who || ''); if (n && n.trim()) { who = n.trim().slice(0, 30); try { localStorage.setItem(SK + '_who', who); } catch (e) {} } paintWho(); }
    function paintWho() { $('who').innerHTML = '<i class="fa-solid fa-user" style="margin-right:.3rem"></i>' + esc(who || 'Đặt tên'); }
    $('who').onclick = askWho;

    /* ---------- Nhận đơn từ quán / báo xong qua ntfy ---------- */
    function pub(topic, obj, tries) {
        tries = tries || 0;
        fetch(NTFY + topic, { method: 'POST', body: JSON.stringify(obj), headers: { Priority: '4' }, keepalive: true }).then(function (r) { if (!r.ok) throw 0; })
            .catch(function () { if (tries < 4) setTimeout(function () { pub(topic, obj, tries + 1); }, [3000, 8000, 20000, 40000][tries]); });
    }
    function onOrder(o) {
        if (!o || !o.id || S.orders.some(function (x) { return x.id === o.id; })) return;
        o.st = 'new'; S.orders.push(o); save(); beep();
        if (S.tab !== 'orders') banner('🥖 Đơn mới bàn ' + o.t);
        render();
    }
    /* Chuyển/gộp bàn từ quán: đổi nhãn bàn của các đơn chưa giao; hoàn tác thì trả lại */
    function onMove(m) {
        if (!m || !m.id || S.seenMv[m.id]) return;
        S.seenMv[m.id] = 1;
        var ks = Object.keys(S.seenMv); if (ks.length > 300) ks.slice(0, ks.length - 300).forEach(function (k) { delete S.seenMv[k]; });
        var n = 0;
        S.orders.forEach(function (o) {
            if (o.st === 'gone') return;
            if (m.undoOf) { if (o.mvId === m.undoOf) { o.t = m.to; o.mvId = null; o.from = null; n++; } }
            else if (String(o.t) === String(m.from)) { o.from = o.from || String(o.t); o.t = m.to; o.mvId = m.id; n++; }
        });
        save();
        if (n) { beep(); banner(m.undoOf ? '↩️ Hoàn tác: bàn ' + m.from + ' → bàn ' + m.to : '🔀 ' + (m.mode === 'merge' ? 'Gộp' : 'Chuyển') + ' bàn ' + m.from + ' → bàn ' + m.to + ' (' + n + ' đơn)'); }
        render();
    }
    try {
        var es = new EventSource(NTFY + TOPIC_IN + '/sse?since=12h');
        es.onopen = function () { $('dot').className = 'dot ok'; $('st').textContent = 'Kết nối đơn hàng ổn định'; };
        es.onerror = function () { $('dot').className = 'dot bad'; $('st').textContent = 'Mất kết nối — đang thử lại'; };
        es.onmessage = function (e) { try { var m = JSON.parse(e.data); if (m.event === 'message') { var d = JSON.parse(m.message); if (d && d.mv) onMove(d); else onOrder(d); } } catch (x) {} };
    } catch (e) {}

    /* ---------- Giao diện ---------- */
    var TABS = [['sell', 'fa-cart-shopping', 'Bán tại xe'], ['orders', 'fa-bell-concierge', 'Đơn từ quán'], ['rev', 'fa-chart-simple', 'Doanh thu']];
    var cnt = function () { return S.orders.filter(function (o) { return o.st === 'new' || o.st === 'cook'; }).length; };
    function render() {
        $('tabs').innerHTML = TABS.map(function (t) { return '<button class="chip' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '"><i class="fa-solid ' + t[1] + '"></i> ' + t[2] + (t[0] === 'orders' && cnt() ? '<b>' + cnt() + '</b>' : '') + '</button>'; }).join('');
        $('body').innerHTML = S.tab === 'sell' ? vSell() : S.tab === 'orders' ? vOrders() : vRev();
        if (S.tab === 'sell') { filterMenu(); var ni = $('itemNoteInput'); if (ni && S.cart[editIdx]) { ni.value = S.cart[editIdx].note || ''; ni.focus(); } }
    }
    function cartTotal() { var t = 0; S.cart.forEach(function (i) { t += (i.p != null && i.p > 0 ? i.p : price(i.n)); }); return t; }
    function fold(x) { return String(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd'); }
    function filterMenu() { var q = fold(searchQ.trim()), bs = document.querySelectorAll('.mi'); for (var k = 0; k < bs.length; k++) bs[k].style.display = (!q || bs[k].dataset.q.indexOf(q) > -1) ? '' : 'none'; }
    function vSell() {
        var cnt = {}; S.cart.forEach(function (i) { cnt[i.n] = (cnt[i.n] || 0) + 1; });
        var n = S.cart.length, t = cartTotal();
        var h = '<div class="sell-layout"><div><div class="card"><div class="sec"><span><i class="fa-solid fa-bread-slice"></i>Gọi món</span></div>' +
            '<div class="srch"><i class="fa-solid fa-magnifying-glass"></i><input id="menuSearch" type="text" placeholder="Tìm món..." autocomplete="off" value="' + esc(searchQ) + '"></div>' +
            '<div class="menu-grid">' + XE_MENU.map(function (m) {
                var q = cnt[m.name] || 0;
                return '<button type="button" class="mi" data-add="' + esc(m.name) + '" data-q="' + esc(fold(m.name)) + '"><span class="nm"><i class="fa-solid fa-circle-plus"></i>' + esc(m.name) + '</span><span class="pr">' + m.price + 'k</span>' + (q ? '<i class="qty" style="font-style:normal">' + q + '</i>' : '') + '</button>';
            }).join('') + '</div></div></div>';
        h += '<div class="card"><div class="sec"><span><i class="fa-solid fa-receipt"></i>Món đã gọi</span><b style="color:var(--accent)">Tổng: ' + money(t) + '</b></div>' +
            '<div class="bill-shadow"><div class="bill-wrap"><div class="bill-scroll">';
        if (!n) h += '<div class="bill-empty"><i class="fa-solid fa-receipt"></i><span>Chưa chọn món nào</span></div>';
        else {
            h += '<div class="bill-head"><b>Xe bánh mì</b><span>' + n + ' món</span></div>';
            S.cart.forEach(function (it, i) {
                var on = !!it.note, ed = editIdx === i, pr = it.p > 0 ? it.p : price(it.n);
                h += '<div class="bill-row"><div class="bill-line"><span class="bill-name">' + esc(it.n) + '</span><span class="bill-leader"></span><span class="bill-price">' + pr + 'k</span></div>' +
                    '<button type="button" class="bill-btn' + (on ? ' bill-btn-on' : '') + '" data-note="' + i + '" aria-label="Ghi chú món" title="Ghi chú món"><i class="' + (on ? 'fa-solid' : 'fa-regular') + ' fa-comment-dots"></i></button>' +
                    '<button type="button" class="bill-btn bill-btn-x" data-rm="' + i + '" aria-label="Xóa món" title="Xóa món"><i class="fa-solid fa-xmark"></i></button></div>' +
                    (ed ? '<input type="text" id="itemNoteInput" maxlength="60" placeholder="Ghi chú món (VD: không rau, thêm ớt)" class="bill-note-input">'
                        : (on ? '<button type="button" class="bill-note" data-note="' + i + '">↳ ' + esc(it.note) + '</button>' : ''));
            });
            h += '<div class="bill-total"><span class="bill-total-label">Tổng cộng<small>' + n + ' món</small></span><span class="bill-total-val">' + t + 'k</span></div>';
        }
        h += '</div></div></div>';
        if (n) {
            h += '<div class="fld"><label>Ghi chú đơn</label><input type="text" id="cartNoteInput" maxlength="80" placeholder="Ghi chú" value="' + esc(S.cartNote) + '"></div>' +
                '<div class="payrow"><button type="button" class="paybtn' + (pay === 'cash' ? ' on' : '') + '" data-pay="cash">💵 Tiền mặt</button><button type="button" class="paybtn' + (pay === 'bank' ? ' on' : '') + '" data-pay="bank">📱 Chuyển khoản</button></div>' +
                '<button class="btn ok" data-pay="go">THU TIỀN ' + money(t) + '</button><button class="btn ghost" data-clear>Xóa đơn</button>';
        }
        h += '</div></div>';
        if (S.ledger.length) { var l = S.ledger[S.ledger.length - 1]; h += '<button class="btn ghost" data-undo><i class="fa-solid fa-rotate-left"></i> Hoàn tác đơn vừa thu (' + hm(l.at) + ' · ' + money(l.total) + ')</button>'; }
        return h;
    }
    function lines(a) { return (a || []).map(function (i) { return i.q + ' × ' + esc(i.n) + (i.note ? ' <span style="color:var(--gold);font-weight:600">— ' + esc(i.note) + '</span>' : ''); }).join('<br>'); }
    function vOrders() {
        var os = S.orders.filter(function (o) { return o.st !== 'gone'; }).sort(function (a, b) { return b.at - a.at; });
        if (!os.length) return '<div class="empty">Chưa có đơn từ quán.<br>Khi phục vụ gọi bánh mì cho bàn, đơn sẽ hiện ở đây.</div>';
        return os.map(function (o) {
            var b = o.st === 'new' ? ['cook', 'Nhận làm', 'gold'] : o.st === 'cook' ? ['done', 'Xong — báo phục vụ', 'ok'] : ['gone', 'Đã giao ✓', 'ghost'];
            return '<div class="card' + (o.st === 'new' ? ' hot' : '') + '"><div class="row"><b>BÀN ' + esc(o.t) + '</b>' + (o.from ? '<span class="lab">từ bàn ' + esc(o.from) + '</span>' : '') + '<span class="mut grow">' + hm(o.at) + (o.by ? ' · ' + esc(o.by) : '') + '</span><span class="lab">' + (o.st === 'new' ? 'Mới' : o.st === 'cook' ? 'Đang làm' : 'Đã xong') + '</span></div>' +
                (o.a && o.a.length ? '<div style="margin-top:.4rem;font-weight:700;font-size:.9rem">' + lines(o.a) + '</div>' : '') +
                (o.r && o.r.length ? '<div class="bad" style="margin-top:.4rem;font-weight:700;font-size:.9rem">❌ HỦY:<br>' + lines(o.r) + '</div>' : '') +
                '<button class="btn ' + b[2] + '" data-st="' + o.id + '|' + b[0] + '">' + b[1] + '</button></div>';
        }).join('');
    }
    function stats() {
        var d0 = new Date().setHours(0, 0, 0, 0), by = {}, cash = 0, bank = 0, sum = 0, n = 0, oq = 0, ov = 0;
        var row = function (k) { return by[k] || (by[k] = { a: 0, b: 0 }); };
        S.ledger.filter(function (x) { return x.at >= d0; }).forEach(function (x) { sum += x.total; if (x.pay === 'bank') bank += x.total; else cash += x.total; n++; x.lines.forEach(function (l) { row(l.n).a += l.q; }); });
        S.orders.filter(function (o) { return o.at >= d0; }).forEach(function (o) {
            (o.a || []).forEach(function (i) { row(i.n).b += i.q; oq += i.q; ov += unit(i) * i.q; });
            (o.r || []).forEach(function (i) { row(i.n).b -= i.q; oq -= i.q; ov -= unit(i) * i.q; });
        });
        return { sum: sum, cash: cash, bank: bank, n: n, oq: oq, ov: ov, by: by };
    }
    function vRev() {
        var s = stats();
        return '<div class="card"><div class="lab">Hôm nay · bán tại xe</div><div class="big">' + money(s.sum) + '</div><div class="mut" style="margin-top:.25rem">' + s.n + ' đơn · Tiền mặt ' + money(s.cash) + ' · Chuyển khoản ' + money(s.bank) + '</div></div>' +
            '<div class="card"><div class="lab">Bánh mì qua bàn (thu ở quán)</div><div class="big" style="font-size:1.15rem">' + s.oq + ' cái · ' + money(s.ov) + '</div><div class="mut">Đã nằm trong bill bàn — KHÔNG thu lại ở xe, chỉ để đối chiếu.</div></div>' +
            '<div class="card">' + (Object.keys(s.by).map(function (k) { return '<div class="sp"><span>' + esc(k) + '</span><span class="mut">xe ' + s.by[k].a + ' · bàn ' + s.by[k].b + '</span></div>'; }).join('') || '<span class="mut">Chưa có số liệu</span>') + '</div>' +
            '<button class="btn gold" data-report><i class="fa-solid fa-paper-plane"></i> Gửi báo cáo chốt xe cho thu ngân</button>';
    }
    function report() {
        var s = stats(), msg = ['🥖 Bán tại xe: ' + money(s.sum) + ' (' + s.n + ' đơn)', '💵 Tiền mặt cần nộp: ' + money(s.cash), '🏦 Chuyển khoản: ' + money(s.bank), '🪑 Bánh mì qua bàn (đã tính trong bill quán): ' + s.oq + ' cái · ' + money(s.ov), '🕒 ' + hm(Date.now()) + (who ? ' · 👤 ' + who : '')];
        sendNotice('🥖 CHỐT XE BÁNH MÌ', msg, 3, { label: 'Chốt xe', noStaff: true });
        banner('Đang gửi báo cáo cho thu ngân…', true);
    }
    document.body.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        var d = b.dataset;
        if (d.tab) S.tab = d.tab;
        else if (d.add) { S.cart.push({ n: d.add, p: price(d.add), note: '' }); }
        else if (d.rm !== undefined) { S.cart.splice(+d.rm, 1); editIdx = null; }
        else if (d.note !== undefined) { editIdx = (editIdx === +d.note) ? null : +d.note; }
                else if (d.clear !== undefined) { S.cart = []; S.cartNote = ''; editIdx = null; }
        else if (d.pay === 'cash' || d.pay === 'bank') pay = d.pay;
        else if (d.pay === 'go') {
            var gm = {}, ls = []; S.cart.forEach(function (it) { var k = it.n + '|' + (it.note || ''); if (!gm[k]) { gm[k] = { n: it.n, q: 0, p: (it.p > 0 ? it.p : price(it.n)), note: it.note || '' }; ls.push(gm[k]); } gm[k].q++; });
            var tot = cartTotal();
            if (!ls.length) return;
            S.ledger.push({ id: 'x' + Date.now().toString(36), at: Date.now(), lines: ls, total: tot, pay: pay, by: who, note: S.cartNote || '' });
            notifySale(S.ledger[S.ledger.length - 1]); S.cart = []; S.cartNote = ''; editIdx = null; banner('Đã thu ' + money(tot) + (pay === 'bank' ? ' (chuyển khoản)' : ''), true); pay = 'cash';
        }
        else if (d.undo !== undefined) { if (confirm('Hoàn tác đơn vừa thu?')) notifyUndo(S.ledger.pop()); else return; }
        else if (d.st) { var p = d.st.split('|'), o = S.orders.filter(function (x) { return x.id === p[0]; })[0]; if (o) { o.st = p[1]; if (p[1] === 'done') pub(TOPIC_OUT, { t: o.t, by: o.by || '', id: o.id, dev: dev, at: Date.now() }); } }
        else if (d.resend !== undefined) { retryNow(); return; }
        else if (d.silence !== undefined) { silenceAll(); return; }
        else if (d.report !== undefined) { report(); return; }
        else return;
        save(); render();
    });
    document.body.addEventListener('input', function (e) {
        var t = e.target;
        if (t.id === 'itemNoteInput') { var it = S.cart[editIdx]; if (it) { it.note = t.value.slice(0, 60); save(); } }
        else if (t.id === 'cartNoteInput') { S.cartNote = t.value.slice(0, 80); save(); }
        else if (t.id === 'menuSearch') { searchQ = t.value; filterMenu(); }
    });
    document.body.addEventListener('keydown', function (e) { if (e.target.id === 'itemNoteInput' && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); editIdx = null; render(); } });
    document.body.addEventListener('focusout', function (e) { if (e.target.id === 'itemNoteInput') { var i0 = editIdx; setTimeout(function () { if (editIdx === i0 && i0 != null) { editIdx = null; render(); } }, 200); } });
    themeSync(); paintWho(); render(); pump();
    (function clk() { var d = new Date(); $('clk').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' · ' + ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2); setTimeout(clk, 20000); })();
    if (!who) setTimeout(askWho, 400);
})();
</script>
</body>
</html>
